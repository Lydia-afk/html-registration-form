<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration form</title>
</head>
<body>
 
 <h1>Company Registration/Service Request Form</h1>
 <p>Please fill in the form below to register your company or request a service.</p>
 <form method="post"action="#">
<fieldset>
<legend>Personal Information</legend>
<label for="fullName">Full Name:</label>
<input type="text"id="fullname"name="fullname"required minlength="3"maxlength="50"partern="[A-Za-z]+">
<br><b>
<label for="email">Email Adress:</label>
<input type="email"id="email"name="email"required>
<br><b>
<label for="phone">Phone Number:</label>
<input type="tel"id="phone"name="phone"required pattern="[0-9]{10}"minlength="10"maxlength="10"placeholder="0712345678">
<br><br>
</fieldset>
<legend>   
</legend>Company Information </legend>
<label for="companyName">Company Name:</label>
<input type="text"id="company Name"name="CompanyName"required minlength="2"maxlength"100">
<br><br>
<label for="website">Company Website:</label>
<input type="url"id="website"name="website"placeholder="https://www.example.com">
<br><br>
<label for="companySize">Company Size:</label>
<select id="companySize"name="companySize"required>
 <option value=""Select company sizes></option>
 <option value="1-10">1-10 employees</option>
 <option value="11-50">11-50 employees</option>
 <option value="51-200">51-200 employees</option>
 <option value="201-500">201-500 employees</option>
 <option value="500+">More than 500 employees</option>
 </select>
 <br><br>
 <label for="industry">industry:</label>
 <input type="text"id="industry"name="industry"required minlength="2"maxlength"50">
 <br><br>
 </fieldset>    
  <fieldset>
  <legend>Service Request</legend>
            <p>Service Type:</p>

            <input type="radio" id="consultation" name="serviceType"
                   value="Consultation" required>
            <label for="consultation">Consultation</label>
            <br>

            <input type="radio" id="installation" name="serviceType"
                   value="Installation">
            <label for="installation">Installation</label>
            <br>

            <input type="radio" id="maintenance" name="serviceType"
                   value="Maintenance">
            <label for="maintenance">Maintenance</label>
            <br><br>

            <p>Preferred Contact Method:</p>

            <input type="checkbox" id="contactEmail" name="contactMethod"
                   value="Email">
            <label for="contactEmail">Email</label>
            <br>

            <input type="checkbox" id="contactPhone" name="contactMethod"
                   value="Phone">
            <label for="contactPhone">Phone</label>
            <br>

            <input type="checkbox" id="contactSMS" name="contactMethod"
                   value="SMS">
            <label for="contactSMS">SMS</label>
            <br><br>

            <label for="appointmentDate">Appointment Date:</label>
            <input type="date" id="appointmentDate" name="appointmentDate"
                   min="2026-01-01" max="2030-12-31" required>
            <br><br>

            <label for="appointmentTime">Appointment Time:</label>
            <input type="time" id="appointmentTime" name="appointmentTime"
                   required>
            <br><br>

            <label for="budget">Budget Range (KSh):</label>
            <input type="number" id="budget" name="budget"
                   min="1000" max="1000000" required>
            <br><br>

        </fieldset> <fieldset>
            <legend>Message and Agreement</legend>

            <label for="message">Additional Information:</label>
            <br>
            <textarea id="message" name="message"
                      rows="5" cols="40"
                      minlength="10" maxlength="500"
                      placeholder="Enter any additional information here..."></textarea>
            <br><br>

            <input type="checkbox" id="terms" name="terms"
                   value="accepted" required>
            <label for="terms">
                I agree to the Terms and Conditions.
            </label>
            <br><br>

        </fieldset>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
</form>
<body>
</html>
